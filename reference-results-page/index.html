<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ColisConnect - Voyages disponibles</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app" aria-label="ColisConnect">
    <section class="top-tabs" aria-label="Mode de recherche">
      <button class="top-tab is-active" type="button" data-tab="traveler">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="14" cy="8" r="3.2"></circle><path d="M8 20c.6-3.2 2.7-5 6-5s5.4 1.8 6 5M4 14.5h5.5M6.5 12v5"></path></svg>
        <span>Chercher un voyageur</span>
      </button>
      <button class="top-tab" type="button" data-tab="requests">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3h10v18H7zM9 1h6v4H9zM10 9h4M10 13h4M10 17h3"></path></svg>
        <span>Voir les demandes</span>
      </button>
    </section>

    <header class="page-heading">
      <div>
        <h1>Voyages disponibles</h1>
        <p>Trouvez le voyage idéal</p>
      </div>
      <label class="currency-select">
        <span class="sr-only">Devise</span>
        <select aria-label="Devise">
          <option>XOF</option>
          <option>EUR</option>
          <option>USD</option>
        </select>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg>
      </label>
    </header>

    <div class="mode-switch" role="group" aria-label="Type de voyage">
      <button class="mode-button is-active" type="button">Simple <span class="check"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12 4.5 4.5L19 7"></path></svg></span></button>
      <button class="mode-button" type="button">Cargo <span class="empty-check" aria-hidden="true"></span></button>
    </div>

    <article class="offer-card">
      <div class="map-wash" aria-hidden="true"></div>
      <section class="route-row" aria-label="Trajet France vers Sénégal">
        <div class="flag-box"><span class="flag flag-fr"></span></div>
        <div class="place"><small>FROM</small><strong>France</strong></div>
        <svg class="route-line" viewBox="0 0 180 56" aria-hidden="true"><path d="M4 42C49 8 113 8 176 40"></path><path class="plane" d="m87 19 18-4-8-9 3-2 11 9 13-3 2 2-9 6 9 8-3 2-14-4-7 9-3-2 3-10-8-2z"></path></svg>
        <div class="place place-to"><small>TO</small><strong>Sénégal</strong></div>
        <div class="flag-box"><span class="flag flag-sn"><i></i></span></div>
      </section>

      <div class="offer-divider"></div>

      <section class="offer-details">
        <div class="detail"><div class="detail-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="2"></rect><path d="M7 2.5v5M17 2.5v5M3.5 10h17"></path></svg></div><div><small>DÉPART</small><strong class="gold">21 août</strong></div></div>
        <div class="detail"><div class="detail-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="7" width="14" height="14" rx="3"></rect><path d="M8 7V5a4 4 0 0 1 8 0v2M12 11v6"></path></svg></div><div><small>DISPONIBILITÉ</small><strong>12 <em>kg</em></strong></div></div>
        <div class="detail price-detail"><div><small>PRIX /KG</small><strong>11 900 FCFA</strong><b>all inclusive</b></div></div>
      </section>

      <div class="offer-divider"></div>

      <footer class="offer-footer">
        <div class="traveler"><span class="avatar" aria-hidden="true"></span><div><strong>Yoann <em>Tato</em></strong><small>VOYAGEUR</small></div><svg class="verified" viewBox="0 0 24 24" aria-hidden="true"><path d="m12 2 8 3v6c0 5-3.4 8.8-8 11-4.6-2.2-8-6-8-11V5z"></path><path d="m8 12 2.5 2.5L16 9"></path></svg></div>
        <button class="contact-button" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5h14v10H9l-4 4z"></path></svg><span>Contacter</span></button>
      </footer>
    </article>

    <div class="action-row"><button class="round-badge" type="button" aria-label="Récompenses"><span></span></button><button class="search-button" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m21 21-4.5-4.5M10.8 18a7.2 7.2 0 1 1 0-14.4 7.2 7.2 0 0 1 0 14.4z"></path></svg><span>Recherche</span></button></div>

    <nav class="bottom-nav" aria-label="Navigation principale">
      <button class="nav-item" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 10 9-7 9 7v10H3z"></path></svg><span>Accueil</span></button>
      <button class="nav-item is-active" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"></circle><path d="m16 16 5 5M4 20h4"></path></svg><span>Recherche</span></button>
      <button class="nav-add" type="button" aria-label="Ajouter"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></button>
      <button class="nav-item" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16v11H8l-4 4z"></path></svg><span>Messages</span></button>
      <button class="nav-item" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="7" r="3.5"></circle><path d="M4.5 21c.6-4.1 3.1-6.2 7.5-6.2s6.9 2.1 7.5 6.2"></path></svg><span>Profil</span></button>
    </nav>
  </main>
  <script>
    document.querySelectorAll('.top-tab').forEach((button) => button.addEventListener('click', () => {
      document.querySelectorAll('.top-tab').forEach((item) => item.classList.toggle('is-active', item === button));
    }));
    document.querySelectorAll('.mode-button').forEach((button) => button.addEventListener('click', () => {
      document.querySelectorAll('.mode-button').forEach((item) => item.classList.toggle('is-active', item === button));
    }));
  </script>
</body>
</html>
