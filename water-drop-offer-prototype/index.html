<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ColisConnect - Prototype goutte prix</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:ital,wght@0,400;0,500;0,700;0,800;1,700;1,800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="prototype-shell">
    <section class="cards-list offers-stream" aria-label="Prototype carte offre">
      <article class="cc3-card">
        <img class="cc3-planet cc3-dark" src="assets/card-image-version/planet-route-cutout.png" alt="" aria-hidden="true">
        <img class="cc3-skyline cc3-dark" src="assets/card-image-version/bottom-city-watermark.png" alt="" aria-hidden="true">

        <header class="cc3-head">
          <div class="cc3-logo">
            <span class="cc3-logo-dot"></span>
            <span class="cc3-logo-txt">COLIS<span>CONNECT</span></span>
          </div>
          <span class="cc3-date">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="3.5" y="4.5" width="17" height="16" rx="2.2"></rect>
              <path d="M8 2.8v4.4M16 2.8v4.4M4 10h16"></path>
            </svg>
            21 août 2026
          </span>
        </header>

        <section class="cc3-route" aria-label="Trajet">
          <div class="cc3-flag-shell"><span class="cc3-flag cc3-flag-fr" aria-hidden="true"></span></div>
          <div class="cc3-place">
            <span class="cc3-label">From</span>
            <span class="cc3-country">France</span>
          </div>
          <svg class="cc3-flight" viewBox="0 0 184 60" aria-hidden="true">
            <path d="M2 47C50 11 105 8 181 45"></path>
            <g class="cc3-plane" transform="translate(86 2) rotate(9)">
              <path d="M25.5 22.2 3.2 30.8 0 26.6l16.2-12.7L0 1.2 3.2-3l22.3 8.7L38.6-6.8c3.2-3 7.2-3.3 8.6-1.5 1.5 1.9-.1 5.5-3.3 8.5L34.3 10.7l18.2 7.1-3.4 4.1-24.4-3.7-11.2 11.6-4-2.6 8.1-13.1z"></path>
            </g>
          </svg>
          <div class="cc3-place cc3-place-to">
            <span class="cc3-label">To</span>
            <span class="cc3-country">Sénégal</span>
          </div>
          <div class="cc3-flag-shell cc3-flag-shell-sn"><span class="cc3-flag cc3-flag-sn" aria-hidden="true"></span></div>
        </section>

        <div class="cc3-rule"></div>

        <section class="cc3-details">
          <div class="cc3-detail">
            <div class="cc3-icon">
              <svg viewBox="0 0 40 40" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <rect x="6" y="9" width="28" height="25" rx="3"></rect>
                <path d="M12 4v10M28 4v10M6 17h28"></path>
              </svg>
            </div>
            <div class="cc3-detail-txt">
              <span class="cc3-d-label">Départ</span>
              <span class="cc3-value"><span class="cc3-gold">21 août</span></span>
            </div>
          </div>

          <div class="cc3-detail">
            <div class="cc3-icon">
              <svg viewBox="0 0 40 40" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <rect x="8" y="13" width="24" height="22" rx="4"></rect>
                <path d="M14 13v-3a6 6 0 0 1 12 0v3M20 19v9"></path>
              </svg>
            </div>
            <div class="cc3-detail-txt">
              <span class="cc3-d-label">Disponibilité</span>
              <span class="cc3-value">12 <span class="cc3-kg">kg</span></span>
            </div>
          </div>

          <div class="cc3-detail cc3-detail-price">
            <div class="cc3-price-source" aria-hidden="true">
              <span class="cc3-d-label">Prix / kg</span>
              <span class="cc3-price">11 900 FCFA</span>
              <span class="cc3-inclusive">all inclusive</span>
            </div>
            <div class="water-lens" aria-label="Prix par kilogramme: 11 900 FCFA all inclusive">
              <div class="water-lens__content">
                <div class="cc3-icon water-lens__icon">
                  <svg viewBox="0 0 40 40" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M5 19.5 19.5 5H34v14.5L19.5 34 5 19.5z"></path>
                    <circle cx="28" cy="11.5" r="2.3"></circle>
                    <path d="M31 6.5c3.2 1.6 4.9 4.1 5.1 7.5"></path>
                  </svg>
                </div>
                <div class="cc3-detail-txt">
                  <span class="cc3-d-label">Prix / kg</span>
                  <span class="cc3-price">11 900 FCFA</span>
                  <span class="cc3-inclusive">all inclusive</span>
                </div>
              </div>
            </div>
          </div>
        </section>

        <footer class="cc3-foot">
          <div class="cc3-profile">
            <span class="cc3-avatar">YT</span>
            <div class="cc3-profile-txt">
              <div class="cc3-name-line">
                <span class="cc3-name">Yoann <em>Tato</em></span>
                <svg class="cc3-shield" viewBox="0 0 36 40" aria-hidden="true">
                  <path d="M18 2.5 32 8v10.3c0 8.5-5.7 15.2-14 18.9C9.7 33.5 4 26.8 4 18.3V8l14-5.5z" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"></path>
                  <path d="M15.6 22.4 12 18.8l-2 2 5.6 5.6L26.8 15.2l-2-2z" fill="currentColor"></path>
                </svg>
              </div>
              <span class="cc3-meta">Voyageur · Paris</span>
            </div>
          </div>
          <button class="cc3-cta" type="button">
            <svg viewBox="0 0 48 48" aria-hidden="true">
              <path d="M23.7 8C14 8 6.1 14.5 6.1 22.5c0 4.7 2.8 8.9 7.1 11.5l-1.1 6.1 7-3.7c1.5.4 3 .6 4.6.6 9.7 0 17.6-6.5 17.6-14.5S33.4 8 23.7 8z"></path>
            </svg>
            <span>Contacter</span>
          </button>
        </footer>
      </article>
    </section>
  </main>
</body>
</html>
