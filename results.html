    <style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

        /* Hide scrollbar for clean horizontal scrolling */
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }

        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .animate-fade-in-down {
            animation: fadeInDown 0.6s ease-out forwards;
        }

        .animate-fade-in-up {
            opacity: 0;
            animation: fadeInUp 0.6s ease-out forwards;
        }

        .delay-100 {
            animation-delay: 100ms;
        }

        .delay-200 {
            animation-delay: 200ms;
        }

        .delay-300 {
            animation-delay: 300ms;
        }

        /* ── Offer Card: reset legacy CSS, Tailwind takes over ── */
        article.offer-compact-card {
            display: flex !important;
            flex-direction: column !important;
            gap: 20px !important;
            padding: 20px !important;
            border-radius: 12px !important;
            background: #1A1B1E !important;
            border: 1px solid rgba(255, 255, 255, 0.1) !important;
            box-shadow: none !important;
            transition: transform 0.3s ease, box-shadow 0.3s ease, border-color 0.3s ease !important;
            max-height: none !important;
            position: relative;
            overflow: hidden;
            cursor: pointer;
        }

        article.offer-compact-card:hover {
            transform: translateY(-4px) !important;
            box-shadow: 0 10px 30px rgba(167, 255, 231, 0.08) !important;
            border-color: rgba(167, 255, 231, 0.4) !important;
        }

        article.offer-compact-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, rgba(167, 255, 231, 0.5), transparent);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        article.offer-compact-card:hover::before {
            opacity: 1;
        }

        /* Cards grid */
        .cards-list.offers-stream {
            display: grid !important;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)) !important;
            gap: 20px !important;
        }

        /* Price */
        article.offer-compact-card .font-price-xl {
            font-size: 28px !important;
            font-weight: 700 !important;
            font-family: 'Space Grotesk', sans-serif !important;
            color: #a7ffe7 !important;
            line-height: 1 !important;
        }

        /* Route stops */
        article.offer-compact-card .font-route-stop {
            font-size: 14px !important;
            font-weight: 600 !important;
            font-family: 'Space Grotesk', sans-serif !important;
            color: #fff !important;
        }

        /* Muted text */
        article.offer-compact-card .text-on-surface-variant {
            color: #b9cac4 !important;
        }

        /* Contact arrow button */
        article.offer-compact-card button[data-reserve-offer] {
            display: flex !important;
            align-items: center !important;
            justify-content: center !important;
            width: 40px !important;
            height: 40px !important;
            border-radius: 50% !important;
            background: rgba(167, 255, 231, 0.08) !important;
            border: 1px solid rgba(167, 255, 231, 0.15) !important;
            cursor: pointer !important;
            transition: all 0.2s ease !important;
            flex-shrink: 0 !important;
        }

        article.offer-compact-card:hover button[data-reserve-offer] {
            background: rgba(167, 255, 231, 0.18) !important;
            border-color: rgba(167, 255, 231, 0.5) !important;
        }

        article.offer-compact-card button[data-reserve-offer] .material-symbols-outlined {
            color: #a7ffe7 !important;
            font-size: 20px !important;
        }
    </style>

        // SaaS UI/UX 2025 - Results Logic

        // Calm Mode Toggle (Neurodiversity)

        const calmToggle = document.getElementById('calm-mode-toggle');

        calmToggle.addEventListener('click', () => {

            document.body.classList.toggle('is-calm');

            const isCalm = document.body.classList.contains('is-calm');

            calmToggle.innerHTML = isCalm

                ? '<svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364-6.364l-.707.707M6.343 17.657l-.707.707m0-11.314l.707.707m11.314 11.314l.707.707M12 8a4 4 0 100 8 4 4 0 000-8z"/></svg>'

                : '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364-6.364l-.707.707M6.343 17.657l-.707.707m0-11.314l.707.707m11.314 11.314l.707.707M12 8a4 4 0 100 8 4 4 0 000-8z"/></svg>';

            localStorage.setItem('calm-mode', isCalm);

        });

        // Restore state

        if (localStorage.getItem('calm-mode') === 'true') {

            document.body.classList.add('is-calm');

        }

    </script>

    <!-- MOBILE FILTER SHEET -->
    <div class="mobile-filter-sheet" id="mobile-filter-sheet">
        <div class="sheet-handle"></div>
        <div class="sheet-header">
            <h3>Filtres</h3>
            <button class="sheet-close" id="mf-close" aria-label="Fermer">&times;</button>
        </div>

        <div class="mobile-filter-fields">
            <div class="mf-field">
                <label>Départ</label>
                <input type="text" id="mf-origin" placeholder="Ville ou pays" autocomplete="off">
            </div>
            <div class="mf-field">
                <label>Arrivée</label>
                <input type="text" id="mf-dest" placeholder="Ville ou pays" autocomplete="off">
            </div>
            <div class="mf-field">
                <label>Date</label>
                <input type="date" id="mf-date">
            </div>
        </div>

        <div class="mobile-filter-chips" id="mf-chips">
            <button class="mf-chip" data-chip="price" id="mf-chip-price">
                <span class="material-symbols-outlined" style="font-size:18px;">payments</span>
                Prix max
            </button>
        </div>

        <div class="mobile-filter-active" id="mf-active">
            <div class="mfa-header">
                <span>Filtres actifs</span>
                <button class="mfa-clear" id="mf-clear-all">Effacer tout</button>
            </div>
            <div class="mfa-tags" id="mf-tags"></div>
        </div>

        <div class="mobile-filter-apply">
            <button id="mf-apply">
                <span class="material-symbols-outlined" style="font-size:20px;">search</span>
                Appliquer les filtres
            </button>
        </div>
    </div>

    <!-- PRICE SLIDER SHEET -->
    <div class="slider-sheet-overlay" id="slider-price-overlay"></div>
    <div class="slider-sheet" id="slider-price-sheet">
        <div class="slider-handle"></div>
        <div class="slider-title">Prix max par kg</div>
        <div class="slider-value" id="slider-price-value">100 000 CFA</div>
        <input type="range" id="slider-price-input" min="0" max="500000" step="5000" value="100000">
        <div class="slider-actions">
            <button class="slider-cancel" id="slider-price-cancel">Annuler</button>
            <button class="slider-ok" id="slider-price-ok">Appliquer</button>
        </div>
    </div>

    <!-- WEIGHT SLIDER SHEET -->
    <div class="slider-sheet-overlay" id="slider-weight-overlay"></div>
    <div class="slider-sheet" id="slider-weight-sheet">
        <div class="slider-handle"></div>
        <div class="slider-title">Poids minimum</div>
        <div class="slider-value" id="slider-weight-value">11 kg</div>
        <input type="range" id="slider-weight-input" min="0" max="100" step="1" value="11">
        <div class="slider-actions">
            <button class="slider-cancel" id="slider-weight-cancel">Annuler</button>
            <button class="slider-ok" id="slider-weight-ok">Appliquer</button>
        </div>
    </div>

    <!-- Basculer thème sombre/clair (Obsidian Luxe / Gold Light) -->
    <button type="button" id="theme-toggle" class="theme-toggle" aria-label="Basculer thème">
        <span id="theme-toggle-icon" class="theme-toggle-icon">🌙</span>
    </button>

    <script>
        (function () {
            var body = document.body;
            var btn = document.getElementById("theme-toggle");
            var icon = document.getElementById("theme-toggle-icon");
            var saved = localStorage.getItem("cc-theme");
            if (saved === "light") {
                body.classList.add("light");
                icon.textContent = "☀️";
            }
            btn.addEventListener("click", function () {
                var light = body.classList.toggle("light");
                icon.textContent = light ? "☀️" : "🌙";
                localStorage.setItem("cc-theme", light ? "light" : "dark");
            });
        })();
    </script>

</body>

</html>
