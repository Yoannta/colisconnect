<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suivi d'Avancement - ColisConnect</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0f172a;
            --surface: #1e293b;
            --surface-hover: #334155;
            --emerald: #10b981;
            --emerald-dark: #059669;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
            --border-glow: rgba(16, 185, 129, 0.3);
            --danger: #ef4444;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Plus Jakarta Sans', sans-serif;
            line-height: 1.6;
            overflow-x: hidden;
        }

        header {
            background: rgba(30, 41, 59, 1);
            padding: 20px 40px;
            border-bottom: 2px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .container {
            max-width: 1400px;
            margin: 40px auto;
            padding: 0 20px;
            display: grid;
            grid-template-columns: 380px 1fr;
            gap: 30px;
        }

        /* Sidebar Styling */
        .sidebar {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .section-title {
            font-size: 1.1rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .btn-status {
            font-size: 0.8rem;
            padding: 4px 10px;
            border-radius: 8px;
            background: rgba(16, 185, 129, 0.1);
            color: var(--emerald);
            border: 1px solid var(--emerald);
            font-weight: bold;
        }

        .feature-item {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 16px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 10px;
        }

        .feature-item.active {
            border-color: var(--emerald);
            background: linear-gradient(145deg, var(--surface), #132724);
        }

        .feature-info {
            flex: 1;
        }

        .feature-title {
            font-weight: 600;
            font-size: 1.1rem;
            margin-bottom: 4px;
        }

        .status-badge {
            font-size: 0.75rem;
            padding: 2px 8px;
            border-radius: 10px;
            font-weight: bold;
        }

        .status-pending {
            background: rgba(245, 158, 11, 0.1);
            color: #f59e0b;
        }

        .status-done {
            background: rgba(16, 185, 129, 0.1);
            color: var(--emerald);
        }

        .btn-delete {
            background: rgba(239, 68, 68, 0.1);
            color: var(--danger);
            border: 1px solid rgba(239, 68, 68, 0.2);
            padding: 4px 8px;
            border-radius: 8px;
            cursor: pointer;
        }

        /* Detail Area */
        .detail-view {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 30px;
            min-height: 600px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .timeline-scroll {
            display: flex;
            gap: 24px;
            padding: 20px 0 40px 0;
            overflow-x: auto;
            flex: 1;
            align-items: stretch;
            -webkit-overflow-scrolling: touch;
        }

        .timeline-scroll::-webkit-scrollbar {
            height: 12px;
            display: block;
        }

        .timeline-scroll::-webkit-scrollbar-thumb {
            background: var(--emerald);
            border-radius: 10px;
        }

        .timeline-column {
            min-width: 350px;
            max-width: 450px;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 24px;
            position: relative;
            flex-shrink: 0;
        }

        /* Task System */
        .task-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-top: 20px;
        }

        .task-item {
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--border);
            border-radius: 8px;
            overflow: hidden;
        }

        .task-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.02);
        }

        .task-body {
            padding: 16px;
            border-top: 1px solid var(--border);
            background: rgba(0, 0, 0, 0.4);
        }

        .task-body label {
            display: block;
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .task-body textarea {
            width: 100%;
            padding: 10px;
            background: #0f172a;
            border: 1px solid var(--border);
            color: white;
            border-radius: 8px;
            font-family: inherit;
            margin-bottom: 10px;
            box-sizing: border-box;
        }

        .task-memory {
            background: #0f172a;
            border: 1px dashed var(--border);
            padding: 12px;
            border-radius: 8px;
            color: #cbd5e1;
            font-size: 0.95rem;
            min-height: 40px;
        }

        .task-toggle {
            background: none;
            border: none;
            color: white;
            cursor: pointer;
            font-size: 1.2rem;
            padding: 0 5px;
        }

        .task-btn {
            font-size: 0.85rem;
            padding: 6px 12px;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            font-weight: 600;
        }

        .btn-exec {
            background: rgba(59, 130, 246, 0.2);
            color: #60a5fa;
            border: 1px solid #3b82f6;
        }

        .btn-cont {
            background: rgba(245, 158, 11, 0.2);
            color: #f59e0b;
            border: 1px solid #f59e0b;
        }

        .btn-val {
            background: rgba(16, 185, 129, 0.2);
            color: var(--emerald);
            border: 1px solid var(--emerald);
        }

        .task-btn:hover {
            filter: brightness(1.2);
        }


        /* Utils */
        .btn-main {
            background: var(--emerald);
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-main:hover {
            transform: scale(1.02);
            background: var(--emerald-dark);
        }

        /* Modal & UI State */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            z-index: 2000;
            display: flex;
            align-items: center;
            justify-content: center;
            visibility: hidden;
            opacity: 0;
            transition: 0.3s;
        }

        .modal.visible {
            visibility: visible;
            opacity: 1;
        }

        .modal-content {
            background: var(--surface);
            padding: 40px;
            border-radius: 20px;
            width: 600px;
            border: 1px solid var(--emerald);
        }

        #sync-badge {
            font-size: 0.8rem;
            background: rgba(59, 130, 246, 0.2);
            color: #60a5fa;
            padding: 5px 12px;
            border-radius: 20px;
            transition: 0.5s;
            opacity: 0;
        }

        #sync-badge.visible {
            opacity: 1;
        }
    </style>
</head>

<body>

    <header>
        <h1><span>⚡</span> ColisConnect Tracker (Mode Pont)</h1>
        <div style="display: flex; align-items: center; gap: 15px;">
            <span id="sync-badge">✅ Changement sauvegardé sur le disque</span>
            <div style="color: var(--text-muted); font-size: 0.9rem;">Port: 3333</div>
        </div>
    </header>

    <div class="container">
        <!-- Sidebar -->
        <div class="sidebar">
            <div class="section-title">
                <span>🚧 Inachevées</span>
                <button class="btn-main" style="padding: 2px 10px;"
                    onclick="document.getElementById('add-modal').classList.add('visible')">+</button>
            </div>
            <div id="pending-list"></div>
            <div class="section-title">✅ Achevées</div>
            <div id="done-list"></div>
        </div>

        <!-- Detail -->
        <div class="detail-view" id="detail-view">
            <div style="text-align:center; padding: 100px 0; color: var(--text-muted);">
                <h3>Sélectionnez une fonctionnalité</h3>
                <p>Vos modifications seront automatiquement sauvegardées par le serveur local.</p>
            </div>
        </div>
    </div>

    <!-- Modals -->
    <div class="modal" id="add-modal">
        <div class="modal-content">
            <h2 style="margin-top:0">Nouvelle Idée</h2>
            <input type="text" id="add-title"
                style="width:100%; padding:12px; margin-bottom:15px; background:#0f172a; border:1px solid var(--border); color:white; border-radius:8px;"
                placeholder="Titre...">
            <textarea id="add-purpose" rows="3"
                style="width:100%; padding:12px; margin-bottom:15px; background:#0f172a; border:1px solid var(--border); color:white; border-radius:8px;"
                placeholder="À quoi ça sert ?"></textarea>
            <button class="btn-main" style="width:100%" onclick="confirmAdd()">🚀 Créer la fonctionnalité</button>
            <button class="btn-main" style="width:100%; background:transparent; margin-top:10px"
                onclick="document.getElementById('add-modal').classList.remove('visible')">Annuler</button>
        </div>
    </div>

    <div class="modal" id="add-task-modal">
        <div class="modal-content">
            <h2 style="margin-top:0">Nouvelle Tâche</h2>
            <input type="text" id="task-title"
                style="width:100%; padding:12px; margin-bottom:15px; background:#0f172a; border:1px solid var(--border); color:white; border-radius:8px; box-sizing: border-box;"
                placeholder="Titre de la tâche...">
            <textarea id="task-prompt" rows="5"
                style="width:100%; padding:12px; margin-bottom:15px; background:#0f172a; border:1px solid var(--border); color:white; border-radius:8px; box-sizing: border-box;"
                placeholder="Prompt (Ex: Créer un nouveau bouton pour configurer le flux...)"></textarea>
            <button class="btn-main" style="width:100%" onclick="confirmTask()">➕ Ajouter la Tâche</button>
            <button class="btn-main" style="width:100%; background:transparent; margin-top:10px"
                onclick="document.getElementById('add-task-modal').classList.remove('visible')">Annuler</button>
        </div>
    </div>

    <script>
        let db = [];
        let activeId = null;

        async function load() {
            try {
                const res = await fetch('/api/db');
                if (!res.ok) throw new Error("Serveur indisponible");
                db = await res.json();
                render();
            } catch (e) {
                alert("ERREUR: Le serveur 'tracker_server.js' ne répond pas.");
            }
        }

        async function save(logMessage = null) {
            try {
                const payload = { db: db };
                if (logMessage) payload.log = logMessage;

                await fetch('/api/save', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const badge = document.getElementById('sync-badge');
                badge.classList.add('visible');
                setTimeout(() => badge.classList.remove('visible'), 2000);
            } catch (e) {
                console.error("Save failed", e);
            }
        }

        function render() {
            const p = document.getElementById('pending-list');
            const d = document.getElementById('done-list');
            p.innerHTML = ''; d.innerHTML = '';

            db.forEach(f => {
                const el = document.createElement('div');
                el.className = `feature-item ${activeId === f.id ? 'active' : ''}`;
                el.innerHTML = `
                    <div class="feature-info" onclick="select('${f.id}')">
                        <div class="feature-title">${f.title}</div>
                        <span class="status-badge ${f.status === 'done' ? 'status-done' : 'status-pending'}">${f.status === 'done' ? 'Fait' : 'En cours'}</span>
                    </div>
                    <button class="btn-delete" onclick="del('${f.id}')">🗑</button>
                `;
                (f.status === 'done' ? d : p).appendChild(el);
            });
            if (activeId) showInDetail(activeId);
        }

        function select(id) { activeId = id; render(); }

        function showInDetail(id) {
            const f = db.find(x => x.id === id);
            if (!f) return;
            if (!f.tasks) f.tasks = [];

            let tasksHtml = '<div class="task-list">';
            f.tasks.forEach(t => {
                let actionBtns = '';
                if (t.status === 'pending') {
                    actionBtns = `<button class="task-btn btn-exec" onclick="execTask('${t.id}')">▶️ Exécuter</button>`;
                } else if (t.status === 'in_progress') {
                    actionBtns = `
                        <button class="task-btn btn-cont" onclick="contTask('${t.id}')">🔄 Continuer</button>
                        <button class="task-btn btn-val" onclick="valTask('${t.id}')">✅ Valider</button>
                    `;
                } else if (t.status === 'done') {
                    actionBtns = `<span class="status-badge status-done">✅ Validé</span>`;
                }

                tasksHtml += `
                    <div class="task-item">
                        <div class="task-header">
                            <div style="display:flex; align-items:center; gap:10px;">
                                <button class="task-toggle" onclick="toggleTask('${t.id}')">⬇️</button>
                                <strong>${t.title}</strong>
                            </div>
                            <div class="task-actions">${actionBtns}</div>
                        </div>
                        <div class="task-body" id="task-body-${t.id}" style="display:none;">
                            <label>Prompt / Consigne :</label>
                            <textarea id="prompt-${t.id}" rows="4">${t.prompt || ''}</textarea>
                            <button class="task-btn" style="background:#334155; color:white;" onclick="savePrompt('${t.id}')" style="margin-bottom:15px">💾 MàJ Prompt</button>
                            
                            <label style="margin-top:15px;">Mémoire IA (Save Point) :</label>
                            <div class="task-memory">${t.memory || 'Aucun résumé IA pour le moment.'}</div>
                        </div>
                    </div>
                `;
            });
            tasksHtml += '</div>';

            document.getElementById('detail-view').innerHTML = `
                <div class="detail-header">
                    <h2>${f.title}</h2>
                    <div class="purpose-box" style="color:var(--text-muted); margin-bottom:20px;">${f.purpose}</div>
                </div>
                <div style="border-top: 1px solid var(--border); padding-top: 20px;">
                    <h3>Liste des Tâches IA</h3>
                    ${tasksHtml}
                    <button class="btn-main" style="margin-top:25px;" onclick="document.getElementById('add-task-modal').classList.add('visible')">+ Ajouter une Tâche</button>
                </div>
            `;
        }

        function del(id) {
            const feature = db.find(x => x.id === id);
            if (!feature) return;

            const reason = prompt(`Détails de la suppression de "${feature.title}" :\nPourquoi veux-tu supprimer cette fonctionnalité ?`);
            if (reason === null) return; // Annuler

            const logMsg = `L'utilisateur veut SUPPRIMER la fonctionnalité "${feature.title}" (ID: ${id}). Raison donnée : "${reason || 'Aucune raison spécifiée'}"`;

            db = db.filter(x => x.id !== id);
            if (activeId === id) activeId = null;
            save(logMsg);
            render();
            alert("Action enregistrée. L'IA supprimera cette fonctionnalité lors de sa prochaine vérification des logs.");
        }

        function toggleTask(id) {
            const body = document.getElementById(`task-body-${id}`);
            if (body) body.style.display = body.style.display === 'none' ? 'block' : 'none';
        }

        function confirmTask() {
            const t = document.getElementById('task-title').value;
            const p = document.getElementById('task-prompt').value;
            if (t && activeId) {
                const feature = db.find(x => x.id === activeId);
                if (!feature.tasks) feature.tasks = [];
                feature.tasks.push({
                    id: 't_' + Date.now().toString(),
                    title: t,
                    prompt: p,
                    status: 'pending',
                    memory: ''
                });
                const logMsg = `[NOUVELLE TÂCHE] Ajout de la tâche "${t}" dans "${feature.title}".`;
                document.getElementById('task-title').value = '';
                document.getElementById('task-prompt').value = '';
                document.getElementById('add-task-modal').classList.remove('visible');
                save(logMsg); render();
            }
        }

        function execTask(taskId) {
            const feature = db.find(x => x.id === activeId);
            const task = feature.tasks.find(x => x.id === taskId);
            task.status = 'in_progress';
            // Alert user visually that AI is notified
            alert("L'IA Antigravity a été notifiée de démarrer cette tâche ! Demandez-lui 'vas regarder'.");
            const logMsg = `[🚀 EXECUTION] L'utilisateur a lancé la tâche "${task.title}" (Feature: ${feature.title}). Prompt: "${task.prompt}"`;
            save(logMsg); render();
        }

        function contTask(taskId) {
            const feature = db.find(x => x.id === activeId);
            const task = feature.tasks.find(x => x.id === taskId);
            alert("L'IA Antigravity a été notifiée de reprendre cette tâche ! Demandez-lui 'vas voir'.");
            const logMsg = `[🔄 REPRISE] L'utilisateur veut CONTINUER la tâche "${task.title}" (Feature: ${feature.title}). Mémoire Actuelle: "${task.memory}"`;
            save(logMsg); render();
        }

        function valTask(taskId) {
            const feature = db.find(x => x.id === activeId);
            const task = feature.tasks.find(x => x.id === taskId);
            if (confirm('Marquer cette tâche comme définitivement validée ?')) {
                task.status = 'done';
                const logMsg = `[✅ VALIDATION] La tâche "${task.title}" a été validée par l'utilisateur.`;
                save(logMsg); render();
            }
        }

        function savePrompt(taskId) {
            const feature = db.find(x => x.id === activeId);
            const task = feature.tasks.find(x => x.id === taskId);
            const newPrompt = document.getElementById(`prompt-${taskId}`).value;
            task.prompt = newPrompt;
            const logMsg = `[📝 MAJ PROMPT] Modification du prompt de la tâche "${task.title}". Nouveau: "${newPrompt}"`;
            save(logMsg);
            alert("Prompt sauvegardé avec succès !");
        }

        function confirmAdd() {
            const t = document.getElementById('add-title').value;
            const p = document.getElementById('add-purpose').value;
            if (t) {
                const logMsg = `L'utilisateur a créé une NOUVELLE IDÉE de fonctionnalité : "${t}". Détails : "${p}"`;
                db.push({ id: Date.now().toString(), status: "pending", title: t, purpose: p, updates: [{ date: "Idée Initiale", text: p }] });
                save(logMsg); render();
                document.getElementById('add-modal').classList.remove('visible');
            }
        }

        load();
    </script>
</body>

</html>
