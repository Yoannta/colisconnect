  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">

<body class="home-page">
  <div id="site-header-root"></div>

  <main class="app-shell">
    <div class="profil-page" id="profil-page">
      <a class="profil-retour" id="profil-retour" href="results.html">← Retour</a>

      <div id="profil-contenu" aria-live="polite">
        <div class="profil-chargement">Chargement du profil…</div>
      </div>
    </div>
  </main>

  <script>
    // Retour contextuel : on revient a la page d'ou l'on vient (dashboard,
    // conversation, recherche...) au lieu de forcer results.html.
    (function () {
      var lien = document.getElementById('profil-retour');
      if (!lien) return;
      var ref = document.referrer || '';
      var memeSite = false;
      try { memeSite = !!ref && new URL(ref).origin === location.origin; } catch (e) { memeSite = false; }
      if (!memeSite) return;
      lien.href = ref;
      lien.textContent = '← Retour';
      lien.addEventListener('click', function (ev) {
        if (window.history.length > 1) {
          ev.preventDefault();
          window.history.back();
        }
      });
    })();
  </script>
</body>
</html>
