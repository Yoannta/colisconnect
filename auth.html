<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <script>
        (function () {
            var isMobile = window.innerWidth <= 800 || /Mobi|Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
            document.documentElement.classList.add(isMobile ? 'mobile-mode' : 'desktop-mode');
        })();
    </script>
    <title>Compte | ColisConnect</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Plus+Jakarta+Sans:wght@400;500;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">    <!-- Supabase Core & Init -->    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>    <script src="supabase-init.js"></script>
    <script defer src="responsive.js"></script>
    <script defer src="password-toggle.js"></script>
    <!-- Header unifié (source unique) -->
    <script defer src="shared-header.js"></script>

    <script defer src="standalone-common.js?v=1"></script>
    <script defer src="auth.js"></script>
</head>

<body>
    <div class="noise-layer" aria-hidden="true"></div>
    <div class="ambient ambient-a" aria-hidden="true"></div>
    <div class="ambient ambient-b" aria-hidden="true"></div>

    <div id="site-header-root"></div>

    <main class="app-shell">
        <section class="view is-active" id="auth-view" data-view="auth">
            <div class="view-head">
                <div>
                    <p class="kicker">Compte</p>
                    <h2>Connexion et inscription</h2>
                </div>
            </div>

            <div class="forms-grid">
                <form id="login-form" class="form-card">
                    <h3>Connexion</h3>
                    <label>Email<input id="login-email" type="email" required></label>
                    <label>Mot de passe<input id="login-password" type="password" minlength="8" required></label>
                    <button type="submit" class="btn secondary">Se connecter</button>
                </form>

                <form id="register-form" class="form-card">
                    <h3>Creer un compte</h3>

                    <div id="register-selection-panel">
                        <p class="form-instruction"
                            style="margin-bottom: 15px; color: var(--muted); font-size: 0.9rem;">
                            Souhaitez-vous vous inscrire en tant que :</p>
                        <div class="auth-selection-grid">
                            <div class="selection-card" data-role="user">
                                <h4>Utilisateur</h4>
                                <p>Vendez vos kilos ou recherchez des voyageurs.</p>
                            </div>
                            <div class="selection-card" data-role="partner">
                                <h4>Partenaire</h4>
                                <p>Entreprise de mise en relation de voyageurs.</p>
                            </div>
                        </div>
                    </div>

                    <div id="register-fields-panel" class="hidden">
                        <input type="hidden" name="userRole" id="register-role" value="user">
                        <label>Nom complet<input id="register-name" type="text" required></label>
                        <label>Email<input id="register-email" type="email" required></label>
                        <label>Mot de passe<input id="register-password" type="password" minlength="8" required></label>
                        <label>Pays de résidence<input id="register-country" type="text" list="country-datalist"
                                placeholder="Ex: France" required></label>
                        <datalist id="country-datalist"></datalist>
                        <button type="submit" class="btn primary">Créer mon compte</button>
                        <button type="button" id="register-back-to-role" class="btn ghost"
                            style="margin-top: 10px; width: 100%;">Retour au choix du profil</button>
                    </div>
                </form>
            </div>

            <p id="auth-feedback" class="auth-feedback"></p>
        </section>
    </main>

    <!-- Navigation Mobile Basse -->
    <div id="mobile-bottom-nav-root"></div>
</body>

</html>
