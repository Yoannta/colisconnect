<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Antigravity Miracle Dashboard 🚀</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Roboto:wght@300;400&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --neon-teal: #00f2ff;
            --neon-orange: #ff7300;
            --bg-dark: #0a0e14;
            --card-bg: #161b22;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-dark);
            color: #e6e6e6;
            font-family: 'Roboto', sans-serif;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            background: linear-gradient(135deg, #1a2332 0%, #0d1117 100%);
            padding: 20px;
            text-align: center;
            border-bottom: 2px solid var(--neon-teal);
            box-shadow: 0 4px 20px rgba(0, 242, 255, 0.2);
        }

        h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.5rem;
            color: var(--neon-teal);
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .container {
            flex: 1;
            padding: 20px;
            max-width: 600px;
            margin: 0 auto;
            width: 100%;
        }

        .status-card {
            background: var(--card-bg);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 25px;
            border: 1px solid rgba(0, 242, 255, 0.1);
            position: relative;
        }

        .status-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 15px;
        }

        .led {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #ff0000;
            box-shadow: 0 0 10px #ff0000;
            animation: pulse 1.5s infinite;
        }

        .led.active {
            background: var(--neon-teal);
            box-shadow: 0 0 10px var(--neon-teal);
        }

        @keyframes pulse {
            0% {
                opacity: 1;
            }

            50% {
                opacity: 0.4;
            }

            100% {
                opacity: 1;
            }
        }

        .progress-container {
            height: 8px;
            background: #252b36;
            border-radius: 4px;
            margin: 20px 0;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, var(--neon-teal), var(--neon-orange));
            width: 0%;
            transition: width 0.5s ease;
        }

        #ai-thought {
            font-style: italic;
            color: #b0b0b0;
            min-height: 50px;
        }

        .command-section {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        textarea {
            width: 100%;
            height: 120px;
            background: #1e242c;
            border: 1px solid #30363d;
            border-radius: 10px;
            color: white;
            padding: 15px;
            font-size: 1rem;
            resize: none;
            outline: none;
            transition: border-color 0.3s;
        }

        textarea:focus {
            border-color: var(--neon-teal);
        }

        button {
            padding: 15px;
            border: none;
            border-radius: 10px;
            font-family: 'Orbitron', sans-serif;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            transition: transform 0.2s, background 0.3s;
        }

        .btn-send {
            background: var(--neon-teal);
            color: var(--bg-dark);
        }

        .btn-send:active {
            transform: scale(0.95);
        }

        .btn-health {
            margin-top: 20px;
            background: linear-gradient(45deg, #ff416c, #ff4b2b);
            color: white;
            width: 100%;
            box-shadow: 0 4px 15px rgba(255, 75, 43, 0.4);
        }

        .footer {
            text-align: center;
            padding: 20px;
            font-size: 0.8rem;
            color: #666;
        }

        #notification {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--neon-orange);
            color: white;
            padding: 10px 20px;
            border-radius: 5px;
            display: none;
            z-index: 100;
        }
    </style>
</head>

<body>

    <header>
        <h1>Miracle Control 🛰️</h1>
    </header>

    <div class="container">
        <div class="status-card">
            <div class="status-header">
                <span>État d'Antigravity</span>
                <div id="status-led" class="led active"></div>
            </div>
            <p id="ai-thought">Chargement de mes neurones...</p>
            <div class="progress-container">
                <div id="progress-bar" class="progress-bar"></div>
            </div>
            <p style="font-size: 0.9rem; color: var(--neon-orange)" id="task-name">Connexion établie...</p>
        </div>

        <div class="command-section">
            <label for="command-input">Tape ton instruction ici :</label>
            <textarea id="command-input"
                placeholder="Ex: Relance le serveur Stripe ou Dis moi si ColisConnect est en ligne..."></textarea>
            <button class="btn-send" onclick="sendCommand()">Envoyer l'ordre ⚡</button>
        </div>

        <button class="btn-health" onclick="alert('Soigne-toi bien ! Je garde le navire pour toi. ❤️')">BOUTON SANTÉ :
            REPOSE-TOI !</button>
    </div>

    <div id="notification">Commande envoyée 📡</div>

    <div class="footer">
        Antigravity Miracles Inc. • En direct de ton PC
    </div>

    <script>
        async function updateStatus() {
            try {
                const res = await fetch('/api/miracle/status');
                const data = await res.json();

                document.getElementById('ai-thought').innerText = data.thought || "Je t'écoute...";
                document.getElementById('progress-bar').style.width = data.progress + "%";
                document.getElementById('task-name').innerText = data.task || "En attente...";

                if (data.active) {
                    document.getElementById('status-led').classList.add('active');
                } else {
                    document.getElementById('status-led').classList.remove('active');
                }
            } catch (e) {
                console.error("Link down", e);
            }
        }

        async function sendCommand() {
            const input = document.getElementById('command-input');
            const cmd = input.value.trim();
            if (!cmd) return;

            try {
                const res = await fetch('/api/miracle/command', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ command: cmd })
                });

                if (res.ok) {
                    const note = document.getElementById('notification');
                    note.style.display = 'block';
                    input.value = '';
                    setTimeout(() => note.style.display = 'none', 3000);
                }
            } catch (e) {
                alert("Erreur de connexion...");
            }
        }

        setInterval(updateStatus, 3000);
        updateStatus();
    </script>

</body>

</html>
